[project]
name = "github-daily-report"
version = "0.1.0"
description = "Daily AI developer report generated by GitHub Actions"
requires-python = ">=3.9"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "respx>=0.21.1"]

[project.scripts]
github-daily-report = "github_daily_report.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
